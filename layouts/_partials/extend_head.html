{{- /* Código inline colorido por tipo (API do Windows, Java, arquivo, rede, hash).
       Só liga em páginas com `inlineCodeColors: true` no front matter.
       Fica no head (e não no footer) porque o PaperMod usa partialCached no footer. */ -}}
{{- if .Params.inlinecodecolors }}
<script>
document.addEventListener("DOMContentLoaded", function () {
    var regras = [
        ["ic-hash", /^[0-9a-f]{32,}$/i],
        ["ic-net", /^(https?:\/\/|[\w.+-]+@[\w-]+\.|\d{1,3}\.\d{1,3}\.\d{1,3}[.\[]|[\w-]+(\.[\w-]+)*\.(com|net|org|io|tech|ch)(\/|:|$))/i],
        ["ic-java", /^\(.*\).*$|^[\w.$]+\(.*\)$|[;{}]|^if \(/],
        ["ic-file", /[\/\\%]|\.(jar|json|zip|exe|class|bin|png|txt|html|py|java|mf|sh)$/i],
        ["ic-file", /^(?!WM_|PW_)[A-Z][A-Z_]{5,}$/],
        ["ic-api", /^(WM_|PW_)[A-Z_]+$|^(Get|Set|Create|Open|Close|Reg|Print|Post|Send|Terminate|Enum|Map|To|Show|Expand|Delete|Select|Pat|Bit|cap|Is|Move|Find|Attach|Allow|Bring|Window|Screen|Fill|Release|System)[A-Z][A-Za-z0-9]*$|^BitBlt$/],
        ["ic-java", /^[a-z][\w]*(\.[a-z_$][\w$]*)+(\.[A-Z][\w$]*)*$|^[A-Z]\w*\.[a-z]\w*$|^[A-Z][a-z]+([A-Z][a-z0-9]*)+$|^[A-Z]\w*\.[A-Z]\w*$|^[A-Z][a-z]+[0-9]*$|^[lIi]{4,}$|^(invokedynamic|long|int|null|getenv|void|static|switch|Main-Class)$/]
    ];
    document.querySelectorAll(".post-content :not(pre) > code").forEach(function (el) {
        var t = el.textContent.trim();
        if (t.length < 3) return;
        for (var i = 0; i < regras.length; i++) {
            if (regras[i][1].test(t)) { el.classList.add("ic", regras[i][0]); return; }
        }
    });
});
</script>
{{- end }}
