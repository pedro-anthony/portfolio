<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 492" width="100%" role="img" aria-labelledby="diag-titulo diag-desc" style="max-width:780px;font-family:inherit">
<title id="diag-titulo">Caminhos para rodar um jogo de console no PC</title>
<desc id="diag-desc">Emulador: Demon's Souls de PS3 roda no RPCS3, que simula o console inteiro e traduz o código ao vivo. Recomp: Majora's Mask de Nintendo 64 vira o Zelda 64: Recompiled, com o código traduzido para x86-64 antes de abrir. Decomp: Ocarina of Time de Nintendo 64 vira o Ship of Harkinian, a partir de um código-fonte reconstruído em C e compilado para o PC. Camada de compatibilidade: Bloodborne de PS4 roda pelo BBPort; o código do jogo roda direto na CPU, só o sistema do console é imitado e os shaders são traduzidos para Vulkan ou DirectX 12.</desc>
<style>
.hdr{fill:var(--secondary,#6c6c6c);font-size:11px;font-weight:700;letter-spacing:.08em}
.lbl{fill:var(--primary,#1e1e1e);font-size:15px;font-weight:700}
.b{fill:var(--primary,#1e1e1e);font-size:14px;font-weight:700}
.t{fill:var(--primary,#1e1e1e);font-size:13px}
.s{fill:var(--secondary,#6c6c6c);font-size:12px}
.box{fill:var(--entry,#fff);stroke:var(--tertiary,#d6d6d6);stroke-width:1.5}
.hl{fill:var(--accent-soft,#f5f5f5);stroke:var(--accent,#6c6c6c);stroke-width:1.5}
.arr{stroke:var(--secondary,#6c6c6c);stroke-width:1.5}
.head{fill:var(--secondary,#6c6c6c)}
</style>
<defs><marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<text x="210.0" y="14" text-anchor="middle" class="hdr">JOGO ORIGINAL</text>
<text x="455.0" y="14" text-anchor="middle" class="hdr">O QUE ACONTECE</text>
<text x="704.0" y="14" text-anchor="middle" class="hdr">RESULTADO NO PC</text>
<text dominant-baseline="middle" text-anchor="start"><tspan x="0" y="84.0" class="lbl">Emulador</tspan></text>
<rect class="box" x="140" y="34" width="140" height="100" rx="8"/>
<text dominant-baseline="middle" text-anchor="middle"><tspan x="210.0" y="75.5" class="b">Demon&#x27;s Souls</tspan><tspan x="210.0" y="92.5" class="s">PlayStation 3</tspan></text>
<line class="arr" x1="284" y1="84.0" x2="304" y2="84.0" marker-end="url(#seta)"/>
<rect class="hl" x="310" y="34" width="290" height="100" rx="8"/>
<text dominant-baseline="middle" text-anchor="middle"><tspan x="455.0" y="58.5" class="b">Simula o console inteiro</tspan><tspan x="455.0" y="75.5" class="t">CPU, GPU e sistema traduzidos ao vivo,</tspan><tspan x="455.0" y="92.5" class="t">enquanto você joga</tspan><tspan x="455.0" y="109.5" class="t">Exige bem mais do hardware do PC</tspan></text>
<line class="arr" x1="604" y1="84.0" x2="624" y2="84.0" marker-end="url(#seta)"/>
<rect class="box" x="630" y="34" width="148" height="100" rx="8"/>
<text dominant-baseline="middle" text-anchor="middle"><tspan x="704.0" y="67.0" class="b">RPCS3</tspan><tspan x="704.0" y="84.0" class="s">jogo roda dentro</tspan><tspan x="704.0" y="101.0" class="s">do emulador</tspan></text>
<text dominant-baseline="middle" text-anchor="start"><tspan x="0" y="202.0" class="lbl">Recomp</tspan></text>
<rect class="box" x="140" y="152" width="140" height="100" rx="8"/>
<text dominant-baseline="middle" text-anchor="middle"><tspan x="210.0" y="193.5" class="b">Majora&#x27;s Mask</tspan><tspan x="210.0" y="210.5" class="s">Nintendo 64</tspan></text>
<line class="arr" x1="284" y1="202.0" x2="304" y2="202.0" marker-end="url(#seta)"/>
<rect class="hl" x="310" y="152" width="290" height="100" rx="8"/>
<text dominant-baseline="middle" text-anchor="middle"><tspan x="455.0" y="176.5" class="b">Traduz o código antes de abrir</tspan><tspan x="455.0" y="193.5" class="t">Instruções do console (MIPS, PowerPC)</tspan><tspan x="455.0" y="210.5" class="t">viram instruções de PC (x86-64)</tspan><tspan x="455.0" y="227.5" class="t">Gráficos e áudio são recriados à parte</tspan></text>
<line class="arr" x1="604" y1="202.0" x2="624" y2="202.0" marker-end="url(#seta)"/>
<rect class="box" x="630" y="152" width="148" height="100" rx="8"/>
<text dominant-baseline="middle" text-anchor="middle"><tspan x="704.0" y="185.0" class="b">Zelda 64:</tspan><tspan x="704.0" y="202.0" class="b">Recompiled</tspan><tspan x="704.0" y="219.0" class="s">executável nativo</tspan></text>
<text dominant-baseline="middle" text-anchor="start"><tspan x="0" y="320.0" class="lbl">Decomp</tspan></text>
<rect class="box" x="140" y="270" width="140" height="100" rx="8"/>
<text dominant-baseline="middle" text-anchor="middle"><tspan x="210.0" y="311.5" class="b">Ocarina of Time</tspan><tspan x="210.0" y="328.5" class="s">Nintendo 64</tspan></text>
<line class="arr" x1="284" y1="320.0" x2="304" y2="320.0" marker-end="url(#seta)"/>
<rect class="hl" x="310" y="270" width="290" height="100" rx="8"/>
<text dominant-baseline="middle" text-anchor="middle"><tspan x="455.0" y="294.5" class="b">Reconstrói o código-fonte</tspan><tspan x="455.0" y="311.5" class="t">Reescrito em C, função por função,</tspan><tspan x="455.0" y="328.5" class="t">e compilado de novo para o PC</tspan><tspan x="455.0" y="345.5" class="t">Cada vez mais feito com ajuda de IA</tspan></text>
<line class="arr" x1="604" y1="320.0" x2="624" y2="320.0" marker-end="url(#seta)"/>
<rect class="box" x="630" y="270" width="148" height="100" rx="8"/>
<text dominant-baseline="middle" text-anchor="middle"><tspan x="704.0" y="303.0" class="b">Ship of</tspan><tspan x="704.0" y="320.0" class="b">Harkinian</tspan><tspan x="704.0" y="337.0" class="s">port nativo</tspan></text>
<text dominant-baseline="middle" text-anchor="start"><tspan x="0" y="429.5" class="lbl">Camada de</tspan><tspan x="0" y="446.5" class="lbl">compatibilidade</tspan></text>
<rect class="box" x="140" y="388" width="140" height="100" rx="8"/>
<text dominant-baseline="middle" text-anchor="middle"><tspan x="210.0" y="429.5" class="b">Bloodborne</tspan><tspan x="210.0" y="446.5" class="s">PlayStation 4</tspan></text>
<line class="arr" x1="284" y1="438.0" x2="304" y2="438.0" marker-end="url(#seta)"/>
<rect class="hl" x="310" y="388" width="290" height="100" rx="8"/>
<text dominant-baseline="middle" text-anchor="middle"><tspan x="455.0" y="412.5" class="b">Imita só o sistema do console</tspan><tspan x="455.0" y="429.5" class="t">Código do jogo roda direto na CPU</tspan><tspan x="455.0" y="446.5" class="t">Chamadas ao sistema → Windows/Linux</tspan><tspan x="455.0" y="463.5" class="t">Shaders traduzidos p/ Vulkan ou DX12</tspan></text>
<line class="arr" x1="604" y1="438.0" x2="624" y2="438.0" marker-end="url(#seta)"/>
<rect class="box" x="630" y="388" width="148" height="100" rx="8"/>
<text dominant-baseline="middle" text-anchor="middle"><tspan x="704.0" y="421.0" class="b">BBPort</tspan><tspan x="704.0" y="438.0" class="s">executável original</tspan><tspan x="704.0" y="455.0" class="s">rodando no PC</tspan></text>
</svg>
